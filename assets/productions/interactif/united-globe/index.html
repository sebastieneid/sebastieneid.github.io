<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Globe interactif — nouvelles lignes United Airlines au départ des Etats-Unis, 2027.
     Autonome, sans dépendance. Texture équirectangulaire (plate carrée). -->
<style>
.lm-uag{--pad:14px;--txt:#1a1a1a;--sub:#6b7680;--perm:#c8442e;--sais:#0f3cf0;--hub:#22303d;
  font-family:"Marr Sans","Helvetica Neue",Helvetica,Arial,sans-serif;
  max-width:660px;margin:0 auto;color:var(--txt);}
.lm-uag .lm-uag-scene{position:relative;width:100%;aspect-ratio:1/1;}
.lm-uag .lm-uag-scene canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab;}
.lm-uag .lm-uag-scene canvas.lm-uag-grab{cursor:grabbing;}
.lm-uag .lm-uag-scene img{display:block;width:100%;height:auto;}
@supports not (aspect-ratio:1/1){
  .lm-uag .lm-uag-scene{height:0;padding-bottom:100%;}
  .lm-uag .lm-uag-scene canvas{position:absolute;top:0;left:0;}
}
/* couche des étiquettes, posée au-dessus du canvas */
.lm-uag .lm-uag-lyr{position:absolute;inset:0;pointer-events:none;overflow:hidden;--fs:12px;}
.lm-uag .lm-uag-lab{position:absolute;white-space:nowrap;font-size:var(--fs);line-height:1;
  letter-spacing:.01em;transform:translateY(-50%);opacity:0;transition:opacity .25s;
  text-shadow:0 0 3px #eaf1f5,0 0 3px #eaf1f5,0 0 6px #eaf1f5;}
.lm-uag .lm-uag-lab.uag-on{opacity:1;}
.lm-uag .lm-uag-lab.uag-hub{font-weight:700;color:var(--hub);font-size:calc(var(--fs) + .5px);}
.lm-uag .lm-uag-lab.uag-perm{color:#9c3322;}
.lm-uag .lm-uag-lab.uag-sais{color:#0e34d4;}
.lm-uag .lm-uag-lab.uag-r{transform:translate(-100%,-50%);}
/* infobulle */
.lm-uag .lm-uag-tip{position:absolute;pointer-events:none;background:#22303d;color:#fff;
  font-size:12px;line-height:1.35;padding:7px 10px;border-radius:3px;max-width:200px;
  transform:translate(-50%,-100%);margin-top:-10px;opacity:0;transition:opacity .12s;}
.lm-uag .lm-uag-tip.uag-on{opacity:1;}
.lm-uag .lm-uag-tip.uag-bas{transform:translate(-50%,0);margin-top:0;}
.lm-uag .lm-uag-tip b{display:block;font-size:12.5px;margin-bottom:2px;}
.lm-uag .lm-uag-tip span{color:#b9c6d0;}
/* barre de vues */
.lm-uag .lm-uag-views{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:2px 0 14px;padding:0 var(--pad);}
.lm-uag .lm-uag-views button{font:inherit;font-size:12px;padding:5px 11px;cursor:pointer;
  border:1px solid #ccd5db;background:#fff;color:var(--sub);border-radius:100px;}
.lm-uag .lm-uag-views button:hover{border-color:#9aa8b2;color:var(--txt);}
.lm-uag .lm-uag-views button[aria-pressed="true"]{background:var(--hub);border-color:var(--hub);color:#fff;}
/* légende */
.lm-uag .lm-uag-liste{margin:0 var(--pad) 14px;padding-left:16px;font-size:12.5px;line-height:1.45;color:#4a5560;}
.lm-uag .lm-uag-liste>li{margin-bottom:9px;list-style:none;}
.lm-uag .lm-uag-liste b{color:var(--hub);}
.lm-uag .lm-uag-liste ul{margin:3px 0 0;padding-left:0;list-style:none;}
.lm-uag .lm-uag-liste ul li{margin-bottom:3px;}
.lm-uag .lm-uag-leg{padding:0 var(--pad) 2px;font-size:12px;color:var(--sub);}
.lm-uag .lm-uag-leg .lm-uag-row{display:flex;flex-wrap:wrap;gap:8px 26px;margin-bottom:8px;}
.lm-uag .lm-uag-leg .lm-uag-it{display:flex;align-items:center;gap:7px;}
.lm-uag .lm-uag-leg svg{display:block;flex:none;}
.lm-uag .lm-uag-foot{border-top:1px solid #e2e8ec;margin:0 var(--pad);padding-top:10px;}
.lm-uag .lm-uag-foot .lm-uag-src{font-size:11px;line-height:1.4;color:#93a0aa;margin:0;}
.lm-uag .lm-uag-foot .lm-uag-sign{font-size:11px;color:#93a0aa;margin:3px 0 0;}
.lm-uag .lm-uag-foot .lm-uag-sign em{font-style:italic;}
.lm-uag .lm-uag-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);
  clip-path:inset(50%);white-space:nowrap;}
.lm-uag h2{font-size:19px;line-height:1.25;margin:0 0 4px;padding:0 var(--pad);font-weight:700;}
.lm-uag .lm-uag-chapo{font-size:13.5px;line-height:1.45;color:var(--sub);margin:0 0 12px;padding:0 var(--pad);}
</style>
<div class="lm-uag"></div>

    if (!pointers[e.pointerId]) nPointers++;
    pointers[e.pointerId] = { x:e.clientX, y:e.clientY };
    canvas.classList.add('lm-uag-grab');
    vel.x = vel.y = 0; moved = 0;
    idleSince = performance.now(); spinRamp = 0;
    stopSpin(); tween = null;
    if (nPointers === 2) pinch = pinchSpan();
  });

  canvas.addEventListener('pointermove', function (e) {
    var rect = canvas.getBoundingClientRect();
    last.x = e.clientX - rect.left; last.y = e.clientY - rect.top;
    var p = pointers[e.pointerId];
    if (!p) { pick(); return; }
    var dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    moved += Math.abs(dx) + Math.abs(dy);
    idleSince = performance.now();

    if (nPointers >= 2) {
      var span = pinchSpan();
      if (pinch > 0 && span > 0) {
        dist = Math.max(DIST_MIN, Math.min(DIST_MAX, dist * (pinch / span)));
        dirty = true;
      }
      pinch = span;
      return;
    }
    // radians par pixel, compensés par la distance
    var k = (2.0 / Math.max(1, H)) * (dist / DIST_START);
    var rx = dy * k, ry = dx * k;
    rotate(rx, ry);
    vel.x = vel.x * 0.4 + rx * 0.6;
    vel.y = vel.y * 0.4 + ry * 0.6;
    setHover(-1);
  });

  function release(e) {
    if (pointers[e.pointerId]) { delete pointers[e.pointerId]; nPointers--; }
    if (nPointers < 2) pinch = 0;
    if (nPointers === 0) canvas.classList.remove('lm-uag-grab');
    idleSince = performance.now();
    if (moved < 6) pick();            // simple tap : on interroge la ligne touchée
  }
  canvas.addEventListener('pointerup', release);
  canvas.addEventListener('pointercancel', release);
  canvas.addEventListener('pointerleave', function (e) {
    // au doigt, le navigateur envoie un pointerleave juste après le tap : il effacerait
    // aussitôt l'infobulle qu'on vient d'ouvrir. On ne réagit qu'à la souris.
    if (e.pointerType === 'mouse') setHover(-1);
  });

  function pinchSpan() {
    var ids = Object.keys(pointers);
    if (ids.length < 2) return 0;
    var a = pointers[ids[0]], b = pointers[ids[1]];
    return Math.hypot(a.x - b.x, a.y - b.y);
  }

  canvas.addEventListener('wheel', function (e) {
    if (!WHEEL_ZOOM && !e.ctrlKey) return;
    e.preventDefault();
    dist = Math.max(DIST_MIN, Math.min(DIST_MAX, dist * Math.exp(e.deltaY * 0.0015)));
    idleSince = performance.now(); spinRamp = 0; stopSpin(); tween = null;
    dirty = true;
  }, { passive:false });

  // ligne la plus proche du curseur, à 14 px près
  function pick() {
    var best = -1, bestD = 14 * 14, i, j, pts, pr, prev;
    for (i = 0; i < lignes.length; i++) {
      pts = lignes[i].pts; prev = null;
      for (j = 0; j < pts.length; j += 2) {
        pr = project(pts[j]);
        if (pr && pr.vis) {
          var dx = pr.x - last.x, dy = pr.y - last.y, d2 = dx*dx + dy*dy;
          if (d2 < bestD) { bestD = d2; best = i; }
        }
      }
    }
    setHover(best);
  }

  function setHover(i) {
    if (i === hover) return;
    hover = i;
    dirty = true;
    if (i < 0) { tip.classList.remove('uag-on'); return; }
    var L = lignes[i];
    tip.innerHTML = '<b>' + nom(L.A) + ' → ' + nom(L.B) + '</b>' +
      '<span>' + (L.r.k === 's' ? 'Ligne saisonnière' : 'Ligne permanente') +
      ' · ' + freqTxt(L.r.f) + '<br>' + L.r.when + '</span>';
    tip.classList.add('uag-on');
    tipH = tip.offsetHeight || 60;      // mesurée une fois, pour savoir si elle tient au-dessus
  }

  // barre de vues
  VUES.forEach(function (v, i) {
    var b = document.createElement('button');
    b.type = 'button'; b.textContent = v.t;
    b.setAttribute('aria-pressed', i === VUE_DEFAUT ? 'true' : 'false');
    b.addEventListener('click', function () {
      vueActive = i;
      Array.prototype.forEach.call(bar.children, function (c, j) {
        c.setAttribute('aria-pressed', j === i ? 'true' : 'false');
      });
      stopSpin(); setHover(-1);
      tween = { q0:q, q1:quatFromView(v.lon, v.lat), d0:dist, d1:v.d, t:0 };
      dirty = true;
    });
    bar.appendChild(b);
  });

  /* ================================================================== */
  /* 10. Étiquettes                                                     */
  /* ================================================================== */

  var labels = Object.keys(AP).map(function (code) {
    var a = AP[code];
    var el = document.createElement('div');
    el.textContent = a.n;
    layer.appendChild(el);
    var route = null;
    for (var i = 0; i < ROUTES.length; i++) if (ROUTES[i].b === code) route = ROUTES[i];
    var kind = a.hub ? 'uag-hub' : (route && route.k === 's' ? 'uag-sais' : 'uag-perm');
    el.className = 'lm-uag-lab ' + kind;
    return {
      el: el, a: a, code: code, kind: kind, p: scale(toVec(a.lon, a.lat), 1.006),

      pri: a.hub ? 0 : (route && route.f === 7 ? 1 : 2)
    };
  }).sort(function (x, y) { return x.pri - y.pri; });

  function placeLabels(alpha) {
    var vus = [], boxes = [], i;

    // 1. qui est visible, et où
    for (i = 0; i < labels.length; i++) {
      var L = labels[i];
      L.enJeu = hover >= 0 && (L.code === ROUTES[hover].a || L.code === ROUTES[hover].b);
      // en colonne étroite : les aéroports de départ, plus les deux bouts de la ligne touchée
      var pr = (alpha > 0.15 && (!etroit || L.a.hub || L.enJeu)) ? project(L.p) : null;
      if (!pr || !pr.vis) { hide(L); continue; }
      L.pr = pr;
      L.w = L.a.n.length * fs * (L.a.hub ? 0.60 : 0.55) + 8;
      vus.push(L);
    }

    // 2. ordre de placement : la ligne touchée d'abord (ses noms ne sautent jamais),
    //    puis les hubs, puis du haut vers le bas — sinon une étiquette chassée par une
    //    voisine finit loin de son point, au risque de désigner le mauvais aéroport.
    vus.sort(function (a, b) {
      return (b.enJeu - a.enJeu) || (a.pri - b.pri) || (a.pr.y - b.pr.y);
    });

    // 3. placement : à droite, à gauche, puis décalé d'une ou deux lignes
    var dy = fs + 1.5, dx = fs * 0.7, hb = fs + 1;
    for (i = 0; i < vus.length; i++) {
      var M = vus[i], p = M.pr, ok = false, k, j, t, bx, by;
      var tries = [[p.x + dx, p.y, 0], [p.x - dx, p.y, 1],
                   [p.x + dx, p.y - dy, 0], [p.x + dx, p.y + dy, 0],
                   [p.x - dx, p.y - dy, 1], [p.x - dx, p.y + dy, 1],
                   [p.x + dx, p.y - 2 * dy, 0], [p.x + dx, p.y + 2 * dy, 0]];
      for (k = 0; k < tries.length && !ok; k++) {
        t = tries[k];
        bx = t[2] ? t[0] - M.w : t[0];
        by = t[1] - hb / 2;
        if (bx < 0 || bx + M.w > W || by < 0 || by + hb > H) continue;
        ok = true;
        for (j = 0; j < boxes.length; j++) {
          if (bx < boxes[j][0] + boxes[j][2] && bx + M.w > boxes[j][0] &&
              by < boxes[j][1] + boxes[j][3] && by + hb > boxes[j][1]) { ok = false; break; }
        }
        if (!ok) continue;
        boxes.push([bx, by, M.w, hb]);
        M.el.className = 'lm-uag-lab ' + M.kind + ' uag-on' + (t[2] ? ' uag-r' : '');
        M.el.style.left = t[0] + 'px';
        M.el.style.top  = t[1] + 'px';
        M.el.style.opacity = (hover >= 0 && !M.enJeu) ? alpha * 0.3 : alpha;
      }
      if (!ok) hide(M);
    }
  }
  function hide(L) {
    L.el.className = 'lm-uag-lab ' + L.kind;
    L.el.style.opacity = 0;
  }

  /* ================================================================== */
  /* 11. Dimensionnement                                                */
  /* ================================================================== */

  function resize() {
    var r = host.getBoundingClientRect();
    if (!r.width || !r.height) return;
    dpr = Math.min(2, window.devicePixelRatio || 1);
    var w = Math.round(r.width * dpr), h = Math.round(r.height * dpr);
    W = r.width; H = r.height;
    if (w === canvas.width && h === canvas.height) return;
    canvas.width = w; canvas.height = h;
    gl.viewport(0, 0, w, h);
    etroit = W < LARGEUR_ETROITE;
    fs = etroit ? 9.5 : (W < 560 ? 11 : 12);
    layer.style.setProperty('--fs', fs + 'px');
    // la liste des liaisons reste réservée aux lecteurs d'écran : en colonne étroite,
    // les destinations se lisent en touchant une ligne
    liste.className = 'lm-uag-sr';
    // innerHTML et non textContent : il y a un <br> forcé avant « le détail »
    chapo.innerHTML = 'Treize liaisons ouvertes au printemps 2027, dont onze vers ' +
      'l’Europe. Faites tourner le globe, ' + (etroit ? 'touchez' : 'survolez') +
      ' une ligne pour<br>le détail.';
    dirty = true;
  }
  if (window.ResizeObserver) new ResizeObserver(resize).observe(host);
  else window.addEventListener('resize', resize);
  resize();

  /* ================================================================== */
  /* 12. Boucle de rendu                                                */
  /* ================================================================== */

  var visible = true, running = false, lastT = 0, raf = 0;

  if (window.IntersectionObserver) {
    new IntersectionObserver(function (entries) {
      visible = entries[0].isIntersecting;
      toggle();
    }, { rootMargin:'100px' }).observe(host);
  }
  document.addEventListener('visibilitychange', function () { toggle(); });

  function toggle() {
    var go = visible && !document.hidden;
    if (go && !running) { running = true; lastT = 0; raf = requestAnimationFrame(frame); }
    else if (!go && running) { running = false; cancelAnimationFrame(raf); }
  }

  function easeOut(t) { return 1 - Math.pow(1 - t, 3); }

  function frame(t) {
    raf = requestAnimationFrame(frame);
    var dt = lastT ? Math.min(64, t - lastT) : 16.7;
    lastT = t;

    if (revealT < 3000) { revealT += dt; dirty = true; }

    if (tween) {                                   // transition vers une vue
      tween.t = Math.min(1, tween.t + dt / 900);
      var e = easeOut(tween.t);
      q = quatSlerp(tween.q0, tween.q1, e);
      dist = tween.d0 + (tween.d1 - tween.d0) * e;
      dirty = true;
      if (tween.t >= 1) tween = null;
    } else if (nPointers === 0) {
      if (Math.abs(vel.x) > 1e-5 || Math.abs(vel.y) > 1e-5) {      // inertie
        var f = dt / 16.7;
        rotate(vel.x * f, vel.y * f);
        var damp = Math.pow(0.93, f);
        vel.x *= damp; vel.y *= damp;
        if (Math.abs(vel.x) < 1e-5) vel.x = 0;
        if (Math.abs(vel.y) < 1e-5) vel.y = 0;
        idleSince = t;
      } else if (spin && t - idleSince > IDLE_RESUME_MS) {
        spinRamp = Math.min(1, spinRamp + dt / 1200);
        spinSelf(spinRamp * SPIN_RATE * dt / 1000);
      }
    }

    if (!dirty) return;
    dirty = false;
    draw();
  }

  // Nombre de cycles de pointillé sur un arc, recalculé à chaque image.
  // Le motif est défini en PIXELS D'ÉCRAN et non en degrés : sinon un tiret paraît
  // deux fois plus court près du bord du globe qu'en son centre, où l'arc est étiré.
  // On mesure l'arc ENTIER, y compris sa partie cachée derrière le globe : le shader
  // répartit les cycles sur toute la longueur, pas sur la portion visible.
  function cyclesPointille(L) {
    var lg = 0, prec = null, i, pr, dx, dy;
    for (i = 0; i < L.pts.length; i += 8) {
      pr = project(L.pts[i]);
      if (pr && prec) {
        dx = pr.x - prec.x; dy = pr.y - prec.y;
        lg += Math.sqrt(dx * dx + dy * dy);
      }
      prec = pr;
    }
    return Math.max(2, Math.min(400, Math.round(lg / (TIRET_PX * 1.85))));
  }

  function draw() {
    var aspect = W / H || 1;
    dEff = dist / Math.min(1, aspect);
    perspective(30 * Math.PI / 180, aspect, 0.1, 100, proj);
    modelView(q, dEff, mv);
    mat4Mul(proj, mv, mvp);

    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

    /* la sphère */
    gl.disable(gl.BLEND);
    gl.depthMask(true);
    gl.useProgram(pGlobe);
    gl.uniformMatrix4fv(gA.mvp, false, mvp);
    gl.bindBuffer(gl.ARRAY_BUFFER, bGPos);
    gl.enableVertexAttribArray(gA.pos); gl.vertexAttribPointer(gA.pos, 3, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, bGUV);
    gl.enableVertexAttribArray(gA.uv);  gl.vertexAttribPointer(gA.uv, 2, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, bGIdx);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.drawElements(gl.TRIANGLES, mesh.count, gl.UNSIGNED_SHORT, 0);
    gl.disableVertexAttribArray(gA.pos); gl.disableVertexAttribArray(gA.uv);

    /* les lignes — profondeur testée mais pas écrite : elles se croisent sans s'entailler */
    gl.enable(gl.BLEND);
    gl.depthMask(false);
    gl.useProgram(pArc);
    gl.uniformMatrix4fv(aA.mvp, false, mvp);
    gl.uniform2f(aA.vp, canvas.width, canvas.height);
    gl.enableVertexAttribArray(aA.pos); gl.enableVertexAttribArray(aA.dir);
    gl.enableVertexAttribArray(aA.side); gl.enableVertexAttribArray(aA.t);

    var i, L, p, dim;
    for (i = 0; i < lignes.length; i++) {
      L = lignes[i];
      p = Math.max(0, Math.min(1, (revealT - L.delay) / 1500));
      L.prog = easeOut(p);
      if (L.prog <= 0) continue;
      dim = (hover >= 0 && hover !== i) ? 0.22 : 1;
      gl.bindBuffer(gl.ARRAY_BUFFER, L.buf);
      gl.vertexAttribPointer(aA.pos,  3, gl.FLOAT, false, 32, 0);
      gl.vertexAttribPointer(aA.dir,  3, gl.FLOAT, false, 32, 12);
      gl.vertexAttribPointer(aA.side, 1, gl.FLOAT, false, 32, 24);
      gl.vertexAttribPointer(aA.t,    1, gl.FLOAT, false, 32, 28);
      gl.uniform1f(aA.hw, (L.width + (hover === i ? 0.7 : 0)) * dpr * 1.35);
      gl.uniform3fv(aA.color, L.color);
      gl.uniform1f(aA.dash, L.pointille ? cyclesPointille(L) : 0);
      gl.uniform1f(aA.prog, L.prog);
      gl.uniform1f(aA.alpha, 0.95 * dim);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, L.count);
    }
    gl.disableVertexAttribArray(aA.pos); gl.disableVertexAttribArray(aA.dir);
    gl.disableVertexAttribArray(aA.side); gl.disableVertexAttribArray(aA.t);

    /* les points */
    gl.useProgram(pDot);
    gl.uniformMatrix4fv(dA.mvp, false, mvp);
    gl.enableVertexAttribArray(dA.pos);
    var appear = Math.max(0, Math.min(1, (revealT - 300) / 700));

    for (i = 0; i < lignes.length; i++) {
      L = lignes[i];
      if (L.prog < 0.98) continue;
      gl.bindBuffer(gl.ARRAY_BUFFER, L.dot);
      gl.vertexAttribPointer(dA.pos, 3, gl.FLOAT, false, 0, 0);
      gl.uniform1f(dA.size, 7.5 * dpr);
      gl.uniform3fv(dA.color, C_HUB);   // mêmes points noirs qu'au départ, en plus petit
      gl.uniform1f(dA.alpha, 1);
      gl.drawArrays(gl.POINTS, 0, 1);
    }
    gl.bindBuffer(gl.ARRAY_BUFFER, bHubs);
    gl.vertexAttribPointer(dA.pos, 3, gl.FLOAT, false, 0, 0);
    gl.uniform1f(dA.size, 10 * dpr);
    gl.uniform3fv(dA.color, C_HUB);
    gl.uniform1f(dA.alpha, appear);
    gl.drawArrays(gl.POINTS, 0, hubs.length);
    gl.disableVertexAttribArray(dA.pos);

    gl.depthMask(true);
    gl.disable(gl.BLEND);

    placeLabels(Math.max(0, Math.min(1, (revealT - 900) / 800)));

    if (hover >= 0) {                       // infobulle accrochée au curseur
      // au-dessus du point si elle y tient, sinon dessous — sur 350 px de large elle
      // se replie sur cinq lignes et dépasserait du cadre
      var bas = last.y - tipH - 14 < 0;
      tip.className = 'lm-uag-tip uag-on' + (bas ? ' uag-bas' : '');
      var marge = Math.min(80, W * 0.3);
      tip.style.left = Math.max(marge, Math.min(W - marge, last.x)) + 'px';
      var y = last.y + (bas ? 14 : -6);
      if (bas) y = Math.min(y, H - tipH - 4);
      tip.style.top = y + 'px';
    }
  }

  toggle();
})();
</script>
